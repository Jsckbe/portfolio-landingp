<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Servicios de tecnología y desarrollo web pragmáticos para tu negocio.">
    <title>pragz.io | Servicios TI pragmáticos</title>
    
    <!-- Tipografía del sitio, servida por Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">pragz.io ✳︎</a>
            
            <button class="hamburger" id="menu-btn" aria-label="Abrir menú" aria-controls="nav-links" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links" id="nav-links" aria-label="Navegación principal">
                <a href="#servicios">Servicios</a>
                <a href="#portafolio">Portafolio</a>
                <a href="#contacto">Contactar</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <!-- Escritorio sigue el puntero; en móvil se repite solo el video. -->
        <div id="cat-avatar" class="cat-avatar" aria-hidden="true">
            <video id="cat-video" class="cat-avatar__video" muted playsinline preload="auto">
                <source src="./assets/video/beast-video-hero1.mp4" type="video/mp4">
            </video>
            <!-- Recortes de la imagen: pose central y respaldo si el video no carga. -->
            <span class="cat-avatar__frame"></span>
            <span class="cat-avatar__frame"></span>
            <span class="cat-avatar__frame"></span>
        </div>

        <div class="hero-content">
            <p class="blurred-label">
                Hola, somos pragz.io<br>
                Tecnología que funciona para tu negocio.
            </p>

            <h1 id="typewriter-text" class="typewriter-container">
                <span id="cursor" class="cursor">|</span>
            </h1>

            <div class="pill-container">
                <a href="https://wa.me/51999999999" target="_blank" rel="noopener noreferrer" class="pill-btn solid">Quiero mi web</a>
                <a href="#servicios" class="pill-btn outline">Ver servicios</a>
                <button id="copy-email" class="pill-btn outline">
                    hello@pragz.io 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>

        </div>

    <section id="servicios" class="servicios">
        <div class="container">
            <h2>Nuestros Servicios</h2>
        </div>
    </section>

    <script src="script.js"></script>
